name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Poetry
        run: pip install "poetry==1.8.3"
      - name: Validar lock file
        run: poetry check --lock
      - name: Instalar dependências (prod + dev)
        run: poetry install --no-interaction
      - name: Lint
        run: poetry run ruff check . && poetry run ruff format --check .
      - name: Funções com no máximo 20 linhas
        run: poetry run python scripts/check_function_length.py
      - name: Testes
        run: poetry run pytest

  docker-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar .env
        run: cp .env.example .env
      - name: Pipeline completo no Docker (MLflow + dvc repro)
        run: docker compose --profile pipeline up --build --abort-on-container-exit --exit-code-from pipeline
      - name: Métricas e registro gerados no container
        run: |
          docker compose --profile pipeline run --rm --no-deps pipeline cat reports/metrics.json reports/registry.json
      - name: Encerrar serviços
        if: always()
        run: docker compose --profile pipeline down -v
